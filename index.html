<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Your File</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121826;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 14px;
      max-width: 340px;
      width: 100%;
      border: 1px solid #334155;
    }
    h2 { margin: 0 0 10px; font-size: 20px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      width: 100%;
      cursor: pointer;
    }
    button:disabled { background: #475569; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 13px; color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h2>File Ready!</h2>
    <p>Watch a short 15-second sponsor video to unlock and download your converted file.</p>
    <button id="adBtn">Watch Video to Unlock</button>
    <div id="status"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // REPLACE WITH YOUR ACTUAL ADSGRAM BLOCK ID
    const ADSGRAM_BLOCK_ID = "YOUR_ADSGRAM_BLOCK_ID_HERE";
    const adController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });

    const btn = document.getElementById("adBtn");
    const statusText = document.getElementById("status");

    btn.addEventListener("click", () => {
      btn.disabled = true;
      statusText.innerText = "Loading ad...";

      adController.show().then((result) => {
        statusText.style.color = "#4ade80";
        statusText.innerText = "Verified! Delivering file...";
        
        // Tells the Telegram Bot the reward is earned
        tg.sendData("UNLOCKED_OK");
      }).catch((err) => {
        btn.disabled = false;
        statusText.style.color = "#f87171";
        statusText.innerText = "Ad not finished. Please watch until the end.";
      });
    });
  </script>
</body>
</html>
